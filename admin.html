<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC.Store | Admin Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8c0000; --accent: #ffcc00; --bg: #0a0a0a; --card: #151515; --text: #e0e0e0; --success: #2e7d32; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
        
        /* --- GIAO DIỆN LOGIN --- */
        #login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid #333; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .logo-login { font-family: 'Bebas Neue', cursive; font-size: 3.5rem; color: var(--primary); letter-spacing: 5px; margin-bottom: 10px; }
        
        /* --- GIAO DIỆN DASHBOARD --- */
        #admin-dashboard { display: none; }
        .sidebar { width: 260px; background: #000; border-right: 1px solid #333; padding: 30px; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .main-content { margin-left: 260px; padding: 40px; }

        /* UI Elements */
        input, button { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
        .btn-primary:hover:not(:disabled) { background: #b30000; transform: translateY(-2px); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }

        .upload-panel { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-row { grid-column: span 2; }

        .inventory-grid { display: grid; gap: 15px; }
        .acc-item { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; display: flex; align-items: center; gap: 20px; }
        .acc-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; }
        .acc-info { flex: 1; }
        .acc-info b { font-size: 1.1rem; display: block; }
        .tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .tag-sold { background: var(--primary); }
        .tag-active { background: var(--success); }

        .btn-logout { background: transparent; border: 1px solid #444; color: #888; margin-top: auto; }
        .btn-logout:hover { color: #fff; border-color: #fff; }

        @media (max-width: 900px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 20px; }
            .upload-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-container">
        <div class="login-card">
            <div class="logo-login">LC.STORE</div>
            <p style="color: #666; margin-bottom: 30px;">HỆ THỐNG QUẢN TRỊ NỘI BỘ</p>
            <input type="email" id="email" placeholder="Email Admin" style="width: 100%; margin-bottom: 15px;">
            <input type="password" id="password" placeholder="Mật khẩu" style="width: 100%; margin-bottom: 25px;">
            <button class="btn-primary" onclick="handleLogin()" style="width: 100%;">TRUY CẬP HỆ THỐNG</button>
        </div>
    </div>

    <div id="admin-dashboard">
        <div class="sidebar">
            <div class="logo-login" style="font-size: 2.5rem;">LC.STORE</div>
            <p style="color: var(--success); font-size: 0.8rem;">● ADMIN SESSION ACTIVE</p>
            <button class="btn-logout" onclick="handleLogout()">Đăng xuất tài khoản</button>
        </div>

        <div class="main-content">
            <div class="upload-panel">
                <div class="full-row" style="color: var(--primary); font-weight: bold; border-left: 3px solid var(--primary); padding-left: 10px;">THÊM SẢN PHẨM MỚI</div>
                <div>
                    <label style="display:block; font-size:0.8rem; color:#888; margin-bottom:5px;">ẢNH TÀI KHOẢN</label>
                    <input type="file" id="imgFile" accept="image/*" style="width: 100%;">
                </div>
                <div>
                    <label style="display:block; font-size:0.8rem; color:#888; margin-bottom:5px;">MÃ TÀI KHOẢN (CODE)</label>
                    <input type="text" id="accCode" placeholder="Ví dụ: LC-99">
                </div>
                <div>
                    <label style="display:block; font-size:0.8rem; color:#888; margin-bottom:5px;">GIÁ BÁN (VNĐ)</label>
                    <input type="number" id="accPrice" placeholder="Ví dụ: 150000">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-primary" onclick="uploadAcc()" id="btnUpload" style="width: 100%;">XÁC NHẬN UP CLOUD</button>
                </div>
            </div>

            <div class="inventory-grid" id="adminGrid">
                <p style="text-align: center; color: #555;">Đang đồng bộ dữ liệu Real-time...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hfeqabmrqvxmnetzbkhi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZXFhYm1ycXZ4bW5ldHpia2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzI4MTEsImV4cCI6MjA4NzMwODgxMX0.UX7WW9OyTUxwWA2Xyzy1i9RmjsTjU2NFaqrn6Nb1T0M';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); //

        // --- HỆ THỐNG AUTH ---
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) showAdmin();
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert("Thông tin đăng nhập không chính xác!");
            else showAdmin();
        }

        async function handleLogout() {
            await sb.auth.signOut();
            location.reload();
        }

        function showAdmin() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadAdmin();
            // Đăng ký Real-time
            sb.channel('db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, loadAdmin).subscribe();
        }

        // --- QUẢN LÝ DỮ LIỆU ---
        async function uploadAcc() {
            const file = document.getElementById('imgFile').files[0];
            const code = document.getElementById('accCode').value;
            const price = document.getElementById('accPrice').value;
            const btn = document.getElementById('btnUpload');

            if(!file || !code || !price) return alert("Nhập đủ đồ đã Cường ơi!");
            btn.disabled = true; btn.innerText = "ĐANG XỬ LÝ...";

            try {
                // Xử lý tên file (Xóa dấu/khoảng trắng)
                const cleanName = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').replace(/[^a-zA-Z0-9._-]/g, "");
                const fileName = `${Date.now()}_${cleanName}`;

                const { error: imgErr } = await sb.storage.from('account-images').upload(fileName, file);
                if(imgErr) throw imgErr;

                const { data: urlData } = sb.storage.from('account-images').getPublicUrl(fileName);
                const { error: dbErr } = await sb.from('accounts').insert([{ code, price, image_url: urlData.publicUrl, is_sold: false }]);
                if(dbErr) throw dbErr;

                alert("Up thành công!");
                document.getElementById('imgFile').value = ''; document.getElementById('accCode').value = ''; document.getElementById('accPrice').value = '';
            } catch (err) {
                alert("Lỗi: " + err.message);
            } finally { btn.disabled = false; btn.innerText = "XÁC NHẬN UP CLOUD"; }
        }

        async function toggleSold(id, status) {
            await sb.from('accounts').update({ is_sold: !status }).eq('id', id);
        }

        async function deleteAcc(id) {
            if(confirm("Xóa vĩnh viễn tài khoản này?")) {
                await sb.from('accounts').delete().eq('id', id);
            }
        }

        async function loadAdmin() {
            // Sắp xếp theo created_at (Cần có cột này trong bảng)
            const { data, error } = await sb.from('accounts').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            const grid = document.getElementById('adminGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="acc-item" style="${item.is_sold ? 'opacity:0.6' : ''}">
                        <img src="${item.image_url}">
                        <div class="acc-info">
                            <b>[${item.code}] <span class="tag ${item.is_sold ? 'tag-sold' : 'tag-active'}">${item.is_sold ? 'SOLD' : 'AVAILABLE'}</span></b>
                            <span style="color:var(--accent)">${Number(item.price).toLocaleString()} VNĐ</span>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button onclick="toggleSold(${item.id}, ${item.is_sold})" style="background:#444; border:none; color:white; padding:8px 12px; cursor:pointer; border-radius:6px;">
                                ${item.is_sold ? 'Mở lại' : 'Đã bán'}
                            </button>
                            <button onclick="deleteAcc(${item.id})" style="background:transparent; border:none; color:#ff4444; cursor:pointer; font-weight:bold;">Xóa</button>
                        </div>
                    </div>`;
            });
        }

        checkSession();
    </script>
</body>
</html>
