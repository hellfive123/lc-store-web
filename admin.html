<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LC.Store - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #c40000; --bg: #0d0d0d; --card: #1a1a1a; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-up { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #333; display: grid; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, button { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; outline: none; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #ff1a1a; transform: translateY(-2px); }
        .list-acc { margin-top: 40px; display: grid; gap: 15px; }
        .item { display: flex; align-items: center; background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid #333; gap: 20px; }
        .item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #444; }
        .item-info { flex-grow: 1; }
        .btn-del { background: #333; color: #ff4444; padding: 8px 15px; font-size: 0.8em; }
        .btn-del:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: var(--primary); letter-spacing: 1px;">LC.STORE - HỆ THỐNG QUẢN TRỊ</h2>
        <div class="form-up">
            <label>1. Chọn ảnh tài khoản (1080x1080):</label>
            <input type="file" id="imgFile" accept="image/*">
            <label>2. Thông tin chi tiết:</label>
            <input type="text" id="accCode" placeholder="Mã số (Ví dụ: LC-Starter-01)">
            <input type="number" id="accPrice" placeholder="Giá tiền (VNĐ)">
            <button onclick="uploadAcc()" id="btnUpload">XÁC NHẬN UP LÊN CLOUD</button>
        </div>

        <div class="list-acc" id="adminGrid">
            <p style="text-align: center; color: #888;">Đang tải danh sách kho hàng...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hfeqabmrqvxmnetzbkhi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZXFhYm1ycXZ4bW5ldHpia2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzI4MTEsImV4cCI6MjA4NzMwODgxMX0.UX7WW9OyTUxwWA2Xyzy1i9RmjsTjU2NFaqrn6Nb1T0M';
        
        // Dùng sb để tránh trùng tên thư viện
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadAcc() {
            const file = document.getElementById('imgFile').files[0];
            const code = document.getElementById('accCode').value;
            const price = document.getElementById('accPrice').value;
            const btn = document.getElementById('btnUpload');

            if(!file || !code || !price) return alert("Cường ơi, hãy nhập đủ thông tin nhé!");

            btn.innerText = "ĐANG UP... VUI LÒNG ĐỢI";
            btn.disabled = true;

            try {
                // 1. Up ảnh lên Bucket 'account-images'
                const fileName = `${Date.now()}_${file.name}`;
                const { data: imgData, error: imgErr } = await sb.storage
                    .from('account-images')
                    .upload(fileName, file);
                
                if(imgErr) throw imgErr;

                // 2. Lấy link ảnh công khai
                const { data: urlData } = sb.storage.from('account-images').getPublicUrl(fileName);
                const imgUrl = urlData.publicUrl;

                // 3. Lưu vào bảng 'accounts'
                const { error: dbErr } = await sb.from('accounts').insert([{ 
                    code: code, 
                    price: parseInt(price), 
                    image_url: imgUrl 
                }]);
                
                if(dbErr) throw dbErr;

                alert("Up tài khoản thành công!");
                location.reload();
            } catch (err) {
                console.error(err);
                alert("Lỗi: " + (err.message || "Không thể up. Hãy kiểm tra Policy trên Supabase!"));
            } finally {
                btn.innerText = "XÁC NHẬN UP LÊN CLOUD";
                btn.disabled = false;
            }
        }

        async function loadAdmin() {
            const { data, error } = await sb.from('accounts').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            const grid = document.getElementById('adminGrid');
            grid.innerHTML = data.length ? '' : '<p style="text-align: center; color: #888;">Kho hàng đang trống.</p>';
            
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="item">
                        <img src="${item.image_url}">
                        <div class="item-info">
                            <b style="display:block; margin-bottom:5px;">[${item.code}]</b>
                            <span style="color: #ffcc00;">${Number(item.price).toLocaleString()} VNĐ</span>
                        </div>
                        <button class="btn-del" onclick="deleteAcc('${item.id}', '${item.image_url}')">XÓA</button>
                    </div>
                `;
            });
        }

        async function deleteAcc(id, url) {
            if(!confirm("Cường có chắc muốn xóa vĩnh viễn tài khoản này?")) return;
            
            // Xóa trong DB
            await sb.from('accounts').delete().eq('id', id);
            
            // Lưu ý: Để xóa ảnh trong Storage cần cấu hình thêm, tạm thời ta xóa hiển thị trước
            alert("Đã xóa xong!");
            location.reload();
        }

        loadAdmin();
    </script>
</body>
</html>
