<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LC.Store | Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8c0000; --accent: #ffcc00; --bg: #0a0a0a; --card: #151515; --text: #e0e0e0; --success: #2e7d32; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #000; border-right: 1px solid #333; padding: 30px; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .logo { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; color: var(--primary); letter-spacing: 3px; margin-bottom: 40px; }
        .nav-item { padding: 12px 0; color: #888; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .nav-item:hover { color: var(--primary); }

        /* Main Content */
        .main { margin-left: 280px; flex: 1; padding: 40px; }
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Form Card */
        .upload-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #333; margin-bottom: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-row { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #888; text-transform: uppercase; }
        input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: #b30000; box-shadow: 0 0 20px rgba(140, 0, 0, 0.4); }

        /* Inventory List */
        .inventory-grid { display: grid; gap: 15px; }
        .acc-item { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; display: flex; align-items: center; gap: 20px; transition: 0.3s; }
        .acc-item:hover { border-color: #444; background: #1a1a1a; }
        .acc-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
        .acc-info { flex: 1; }
        .acc-info b { font-size: 1.1rem; display: block; margin-bottom: 4px; }
        .acc-info span { color: var(--accent); font-weight: bold; }
        .status-tag { padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 10px; }
        .status-sold { background: var(--primary); color: white; }
        .status-active { background: var(--success); color: white; }

        .actions { display: flex; gap: 10px; }
        .btn-icon { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-icon:hover { background: #444; }
        .btn-del { color: #ff4444; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">LC.STORE</div>
        <div class="nav-item">DASHBOARD</div>
        <div class="nav-item">INVENTORY</div>
        <div class="nav-item" style="margin-top:auto; color:#444">VER 2.0 PRO</div>
    </div>

    <div class="main">
        <div class="header-panel">
            <h2>HỆ THỐNG QUẢN TRỊ KHO</h2>
            <div id="connection-status" style="font-size: 0.8rem; color: var(--success)">● CLOUD CONNECTED</div>
        </div>

        <div class="upload-card">
            <div class="full-row" style="color: var(--primary); font-weight: bold; border-left: 4px solid var(--primary); padding-left: 15px;">THÊM TÀI KHOẢN MỚI</div>
            <div>
                <label>Ảnh tài khoản (1080x1080)</label>
                <input type="file" id="imgFile" accept="image/*">
            </div>
            <div>
                <label>Mã số tài khoản</label>
                <input type="text" id="accCode" placeholder="VD: LC-STARTER-01">
            </div>
            <div>
                <label>Giá niêm yết (VNĐ)</label>
                <input type="number" id="accPrice" placeholder="VD: 200000">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-main" onclick="uploadAcc()" id="btnUpload" style="width: 100%;">XÁC NHẬN UP CLOUD</button>
            </div>
        </div>

        <div class="inventory-grid" id="adminGrid">
            <p style="color: #666; text-align: center;">Đang đồng bộ dữ liệu Real-time...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hfeqabmrqvxmnetzbkhi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZXFhYm1ycXZ4bW5ldHpia2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzI4MTEsImV4cCI6MjA4NzMwODgxMX0.UX7WW9OyTUxwWA2Xyzy1i9RmjsTjU2NFaqrn6Nb1T0M';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadAcc() {
            const file = document.getElementById('imgFile').files[0];
            const code = document.getElementById('accCode').value;
            const price = document.getElementById('accPrice').value;
            const btn = document.getElementById('btnUpload');

            if(!file || !code || !price) return alert("Vui lòng điền đủ thông tin!");
            btn.innerText = "ĐANG XỬ LÝ..."; btn.disabled = true;

            try {
                const cleanName = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                const fileName = `${Date.now()}_${cleanName}`;
                const { error: imgErr } = await sb.storage.from('account-images').upload(fileName, file);
                if(imgErr) throw imgErr;

                const { data: urlData } = sb.storage.from('account-images').getPublicUrl(fileName);
                const { error: dbErr } = await sb.from('accounts').insert([{ code, price, image_url: urlData.publicUrl, is_sold: false }]);
                if(dbErr) throw dbErr;

                alert("Up thành công!");
                document.getElementById('accCode').value = ''; document.getElementById('accPrice').value = '';
            } catch (err) { alert(err.message); } 
            finally { btn.innerText = "XÁC NHẬN UP CLOUD"; btn.disabled = false; }
        }

        async function toggleSold(id, status) {
            await sb.from('accounts').update({ is_sold: !status }).eq('id', id);
        }

        async function deleteAcc(id) {
            if(confirm("Xóa vĩnh viễn?")) await sb.from('accounts').delete().eq('id', id);
        }

        async function loadAdmin() {
            const { data } = await sb.from('accounts').select('*').order('created_at', { ascending: false });
            const grid = document.getElementById('adminGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="acc-item">
                        <img src="${item.image_url}">
                        <div class="acc-info">
                            <b>[${item.code}] <span class="status-tag ${item.is_sold ? 'status-sold' : 'status-active'}">${item.is_sold ? 'SOLD' : 'AVAILABLE'}</span></b>
                            <span>${Number(item.price).toLocaleString()} VNĐ</span>
                        </div>
                        <div class="actions">
                            <button class="btn-icon" onclick="toggleSold(${item.id}, ${item.is_sold})">${item.is_sold ? 'Mở bán' : 'Đã bán'}</button>
                            <button class="btn-icon btn-del" onclick="deleteAcc(${item.id})">Xóa</button>
                        </div>
                    </div>`;
            });
        }

        // Real-time Subscription
        sb.channel('admin-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, loadAdmin).subscribe();
        loadAdmin();
    </script>
</body>
</html>
