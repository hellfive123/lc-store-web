<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LC.Store | Limbus Company Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c40000; --accent: #ffcc00; --bg: #050505; --card: #111; --text: #fff; --input-bg: #1a1a1a; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* Header Responsive */
        header { height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(rgba(0,0,0,0.7), var(--bg)), url('https://images2.alphacoders.com/131/1313658.png'); background-size: cover; background-position: center; text-align: center; border-bottom: 3px solid var(--primary); padding: 0 20px; }
        header h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: 5px; color: var(--primary); text-shadow: 0 0 20px rgba(196, 0, 0, 0.5); }
        header p { font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: clamp(0.7rem, 2vw, 1rem); }

        /* Filter Bar Responsive */
        .filter-container { max-width: 1400px; margin: -30px auto 30px; padding: 0 15px; position: relative; z-index: 20; }
        .filter-bar { background: #161616; padding: 15px; border-radius: 12px; border: 1px solid #333; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .filter-group { flex: 1; min-width: calc(50% - 6px); } /* 2 cột trên mobile */
        .filter-group.full-mobile { min-width: 100%; }
        label { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; background: var(--input-bg); border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: var(--primary); }
        
        /* Grid Sản phẩm - 2 cột trên Mobile, 3-4 cột trên Desktop */
        .container { max-width: 1400px; margin: 0 auto 50px; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        /* Card Responsive */
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; position: relative; transition: 0.3s; display: flex; flex-direction: column; }
        .img-box { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .acc-code { font-family: 'Bebas Neue', cursive; font-size: 1.2rem; margin: 0 0 5px; color: #fff; line-height: 1; }
        .acc-price { font-size: 1rem; color: var(--accent); font-weight: 800; margin-bottom: 12px; display: block; }
        .btn-buy { width: 100%; background: var(--primary); color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-top: auto; }

        /* Sold State */
        .sold-out { filter: grayscale(1); opacity: 0.6; }
        .sold-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); border: 3px double var(--primary); color: var(--primary); padding: 5px 15px; font-family: 'Bebas Neue'; font-size: 1.5rem; background: rgba(0,0,0,0.8); z-index: 10; border-radius: 8px; white-space: nowrap; }

        /* Lightbox Responsive */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--primary); }

        /* Media Queries cho Desktop */
        @media (min-width: 768px) {
            header { height: 50vh; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
            .filter-group { min-width: 200px; }
            .acc-code { font-size: 1.8rem; }
            .acc-price { font-size: 1.5rem; }
            .card-content { padding: 25px; }
            .btn-buy { padding: 15px; font-size: 1rem; }
            .sold-stamp { font-size: 3rem; border-width: 6px; padding: 10px 30px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>LC.STORE</h1>
        <p>Gachaverse Management System | Premium Accounts</p>
    </header>

    <div class="filter-container">
        <div class="filter-bar">
            <div class="filter-group full-mobile">
                <label>Tìm kiếm mã số</label>
                <input type="text" id="searchCode" placeholder="Nhập mã..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label>Giá tối đa</label>
                <input type="number" id="maxPrice" placeholder="VNĐ" oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label>Trạng thái</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">Tất cả</option>
                    <option value="available" selected>Còn hàng</option>
                    <option value="sold">Đã bán</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="userGrid"></div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'"><img id="zoomImg"></div>

    <script>
        const sb = supabase.createClient('https://hfeqabmrqvxmnetzbkhi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZXFhYm1ycXZ4bW5ldHpia2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzI4MTEsImV4cCI6MjA4NzMwODgxMX0.UX7WW9OyTUxwWA2Xyzy1i9RmjsTjU2NFaqrn6Nb1T0M');
        
        let allAccounts = [];

        async function loadShop() {
            const { data, error } = await sb.from('accounts').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            allAccounts = data;
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchCode').value.toLowerCase();
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allAccounts.filter(p => {
                const matchCode = p.code.toLowerCase().includes(searchQuery);
                const matchPrice = p.price <= maxPrice;
                const matchStatus = statusFilter === 'all' ? true : statusFilter === 'available' ? !p.is_sold : p.is_sold;
                return matchCode && matchPrice && matchStatus;
            });
            renderGrid(filtered);
        }

        function renderGrid(data) {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = data.length ? '' : '<p style="grid-column: 1/-1; text-align: center; color: #555; padding: 40px 0;">Không tìm thấy kết quả...</p>';
            
            data.forEach(p => {
                const fbLink = `https://www.facebook.com/lcstoregachaverse`;
                grid.innerHTML += `
                    <div class="card ${p.is_sold ? 'sold-out' : ''}">
                        ${p.is_sold ? '<div class="sold-stamp">SOLD</div>' : ''}
                        <div class="img-box" onclick="${p.is_sold ? '' : `zoom('${p.image_url}')`}">
                            <img src="${p.image_url}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <h2 class="acc-code">[${p.code}]</h2>
                            <span class="acc-price">${Number(p.price).toLocaleString()}đ</span>
                            <a href="${p.is_sold ? '#' : fbLink}" target="_blank" class="btn-buy" style="${p.is_sold ? 'background:#333' : ''}">
                                ${p.is_sold ? 'HẾT HÀNG' : 'MUA NGAY'}
                            </a>
                        </div>
                    </div>`;
            });
        }

        function zoom(src) { document.getElementById('zoomImg').src = src; document.getElementById('lightbox').style.display = 'flex'; }
        
        sb.channel('shop-updates').on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, loadShop).subscribe();
        loadShop();
    </script>
</body>
</html>
