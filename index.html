<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC.Store · Shop acc Limbus Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Hallmark · genre: atmospheric · macrostructure: catalogue-grid · theme: Midnight-crimson
         * nav: masthead-compact · footer: Ft2 inline · enrichment: Tier-A CSS glow
         * pre-emit critique: P4 H4 E4 S4 R4 V5
         */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { overflow-x: clip; }
        body {
            margin: 0;
            font-family: var(--font-body);
            font-size: var(--text-base);
            line-height: 1.55;
            color: var(--color-ink);
            background: var(--color-paper);
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }

        /* ---------- Masthead ---------- */
        .mast {
            position: relative;
            padding: var(--space-xl) var(--space-sm) var(--space-lg);
            text-align: center;
            overflow: clip;
            border-bottom: 1px solid var(--color-rule-soft);
        }
        .mast::before {
            content: ""; position: absolute; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 55% at 50% -10%, oklch(30% 0.09 25 / 0.9), transparent 70%),
                radial-gradient(ellipse 35% 40% at 82% 10%, oklch(24% 0.06 85 / 0.5), transparent 70%),
                repeating-linear-gradient(90deg, oklch(100% 0 0 / 0.015) 0 1px, transparent 1px 56px);
            pointer-events: none;
        }
        .mast > * { position: relative; z-index: 1; }
        .mast__brand {
            font-size: var(--text-display);
            font-weight: 800;
            color: var(--color-ink);
            line-height: 1.02;
        }
        .mast__brand em { font-style: normal; color: var(--color-accent-hot); }
        .mast__tag {
            margin: var(--space-2xs) auto 0;
            color: var(--color-neutral);
            font-size: var(--text-sm);
            max-width: 42ch;
        }
        .mast__stock {
            display: inline-flex; align-items: center; gap: var(--space-2xs);
            margin-top: var(--space-sm);
            padding: 0.35rem 0.9rem;
            border: 1px solid var(--color-rule);
            border-radius: var(--radius-chip);
            background: oklch(17% 0.014 20 / 0.7);
            font-size: var(--text-sm);
            color: var(--color-ink-2);
        }
        .mast__stock b { font-family: var(--font-display); color: var(--color-ink); }
        .mast__stock::before {
            content: ""; width: 8px; height: 8px; border-radius: 50%;
            background: var(--color-pos);
        }

        /* ---------- Toolbar ---------- */
        .toolbar-wrap { max-width: 1240px; margin: var(--space-md) auto 0; padding: 0 var(--space-sm); }
        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--space-xs);
            background: var(--color-paper-2);
            border: 1px solid var(--color-rule-soft);
            border-radius: var(--radius-card);
            padding: var(--space-sm);
            box-shadow: var(--shadow-card);
        }
        .field { display: grid; gap: var(--space-3xs); min-width: 0; }
        .field label {
            font-size: var(--text-xs); font-weight: 600; color: var(--color-neutral);
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .field input, .field select {
            width: 100%;
            font: inherit; font-size: var(--text-sm); color: var(--color-ink);
            background: var(--color-paper-3);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius-input);
            padding: 0.55rem 0.7rem;
            transition: border-color var(--dur-short) var(--ease-out);
        }
        .field input::placeholder { color: var(--color-neutral); }
        .field input:hover, .field select:hover { border-color: var(--color-neutral); }
        .field input:focus-visible, .field select:focus-visible {
            outline: 2px solid var(--color-focus); outline-offset: 1px;
            border-color: var(--color-focus);
        }
        .field select option { background: var(--color-paper-2); }

        /* ---------- Grid ---------- */
        .shop { max-width: 1240px; margin: var(--space-md) auto var(--space-2xl); padding: 0 var(--space-sm); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
            gap: var(--space-sm);
        }
        @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xs); } }

        .card {
            display: flex; flex-direction: column;
            background: var(--color-paper-2);
            border: 1px solid var(--color-rule-soft);
            border-radius: var(--radius-card);
            overflow: clip;
            position: relative;
            transition: border-color var(--dur-short) var(--ease-out), transform var(--dur-med) var(--ease-out);
        }
        @media (hover: hover) {
            .card:not(.is-sold):hover { transform: translateY(-4px); border-color: var(--color-accent); }
        }
        .card__img {
            width: 100%; aspect-ratio: 1 / 1;
            position: relative; overflow: clip;
            cursor: zoom-in;
            background: var(--color-paper-3);
            border: none; padding: 0; display: block;
        }
        .card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card__img:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }

        .badge-new {
            position: absolute; top: var(--space-2xs); left: var(--space-2xs);
            font-family: var(--font-display); font-weight: 700; font-size: var(--text-xs);
            background: var(--color-accent); color: var(--color-accent-ink);
            padding: 0.15rem 0.55rem;
            border-radius: var(--radius-chip);
            letter-spacing: 0.03em;
        }

        .card__body { padding: var(--space-xs) var(--space-xs) var(--space-sm); display: flex; flex-direction: column; gap: var(--space-2xs); flex: 1; }
        .card__code {
            font-family: var(--font-mono); font-weight: 600;
            font-size: var(--text-sm); color: var(--color-ink-2);
            letter-spacing: 0.02em;
            overflow-wrap: anywhere;
        }
        .card__price {
            font-family: var(--font-display); font-weight: 800;
            font-size: var(--text-lg); color: var(--color-gold);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }
        .card__actions { display: grid; gap: var(--space-3xs); margin-top: auto; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3xs);
            font: inherit; font-weight: 600; font-size: var(--text-sm);
            border-radius: var(--radius-btn);
            border: 1px solid transparent;
            padding: 0.55rem 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: background var(--dur-short) var(--ease-out),
                        border-color var(--dur-short) var(--ease-out),
                        transform var(--dur-short) var(--ease-out);
        }
        .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
        .btn:active { transform: translateY(1px); }
        .btn--buy { background: var(--color-accent); color: var(--color-accent-ink); }
        .btn--buy:hover { background: var(--color-accent-hot); }
        .btn--copy { background: transparent; color: var(--color-ink-2); border-color: var(--color-rule); }
        .btn--copy:hover { background: var(--color-paper-3); border-color: var(--color-neutral); }
        .btn--copy.is-done { color: var(--color-pos); border-color: var(--color-pos); }

        /* Sold */
        .card.is-sold .card__img { cursor: default; }
        .card.is-sold img { filter: grayscale(1) brightness(0.55); }
        .card.is-sold .card__price { color: var(--color-neutral); }
        .sold-stamp {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            font-family: var(--font-display); font-weight: 800; font-size: var(--text-lg);
            color: var(--color-accent-hot);
            border: 3px double var(--color-accent-hot);
            border-radius: var(--radius-input);
            padding: 0.2rem 0.8rem;
            background: oklch(10% 0.01 20 / 0.85);
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        /* ---------- Skeleton ---------- */
        .skel { border-radius: var(--radius-card); overflow: clip; border: 1px solid var(--color-rule-soft); }
        .skel__img { aspect-ratio: 1/1; }
        .skel__line { height: 14px; margin: var(--space-2xs) var(--space-xs); border-radius: 4px; }
        .skel__line--short { width: 45%; }
        .skel__img, .skel__line {
            background: linear-gradient(100deg, var(--color-paper-2) 40%, var(--color-paper-3) 50%, var(--color-paper-2) 60%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite linear;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .empty {
            grid-column: 1 / -1;
            text-align: center; color: var(--color-neutral);
            padding: var(--space-xl) var(--space-sm);
        }

        /* ---------- Lightbox ---------- */
        .lightbox {
            position: fixed; inset: 0; z-index: 100;
            background: oklch(8% 0.008 20 / 0.96);
            display: none;
            justify-content: center; align-items: center;
            padding: var(--space-sm);
            cursor: zoom-out;
        }
        .lightbox.is-open { display: flex; }
        .lightbox img {
            max-width: 100%; max-height: 100%;
            border-radius: var(--radius-input);
            border: 1px solid var(--color-rule);
        }

        /* ---------- Toast ---------- */
        .toasts {
            position: fixed; bottom: var(--space-sm); left: 50%; transform: translateX(-50%);
            z-index: 120; display: grid; gap: var(--space-3xs); width: min(92vw, 360px);
        }
        .toast {
            display: flex; align-items: center; gap: var(--space-2xs);
            background: var(--color-paper-3);
            border: 1px solid var(--color-rule);
            color: var(--color-ink);
            border-radius: var(--radius-card);
            padding: var(--space-2xs) var(--space-sm);
            font-size: var(--text-sm);
            box-shadow: var(--shadow-pop);
            animation: rise var(--dur-med) var(--ease-out);
        }
        .toast::before { content: "✓"; color: var(--color-pos); font-weight: 700; }
        .toast--error::before { content: "!"; color: var(--color-accent-hot); }
        .toast.is-leaving { opacity: 0; transition: opacity var(--dur-med) var(--ease-out); }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ---------- Footer ---------- */
        .footer {
            max-width: 1240px; margin: 0 auto;
            padding: var(--space-sm);
            border-top: 1px solid var(--color-rule-soft);
            display: flex; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap;
            font-size: var(--text-xs); color: var(--color-neutral);
        }
        .footer a { color: var(--color-ink-2); text-decoration: none; border-bottom: 1px solid var(--color-rule); }
        .footer a:hover { color: var(--color-accent-hot); border-color: var(--color-accent-hot); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<header class="mast">
    <h1 class="mast__brand">LC<em>.</em>STORE</h1>
    <p class="mast__tag">Kho acc Limbus Company tuyển chọn — giao dịch qua Fanpage, uy tín từng đơn.</p>
    <p class="mast__stock" id="stockPill"><b id="stockCount">…</b>&nbsp;acc đang còn hàng</p>
</header>

<div class="toolbar-wrap">
    <div class="toolbar">
        <div class="field">
            <label for="searchCode">Tìm mã acc</label>
            <input type="search" id="searchCode" placeholder="VD: LC-01">
        </div>
        <div class="field">
            <label for="maxPrice">Giá tối đa</label>
            <input type="number" id="maxPrice" inputmode="numeric" min="0" placeholder="500000">
        </div>
        <div class="field">
            <label for="statusFilter">Trạng thái</label>
            <select id="statusFilter">
                <option value="available" selected>Còn hàng</option>
                <option value="sold">Đã bán</option>
                <option value="all">Tất cả</option>
            </select>
        </div>
        <div class="field">
            <label for="sortBy">Sắp xếp</label>
            <select id="sortBy">
                <option value="newest" selected>Mới nhất</option>
                <option value="price-asc">Giá thấp → cao</option>
                <option value="price-desc">Giá cao → thấp</option>
            </select>
        </div>
    </div>
</div>

<main class="shop">
    <div class="grid" id="userGrid"></div>
</main>

<footer class="footer">
    <span>© LC.Store — shop acc Limbus Company</span>
    <a href="https://www.facebook.com/lcstoregachaverse" target="_blank" rel="noopener">Fanpage Facebook</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Xem ảnh phóng to"><img id="zoomImg" alt=""></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';

const SUPABASE_URL = 'https://hfeqabmrqvxmnetzbkhi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZXFhYm1ycXZ4bW5ldHpia2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzI4MTEsImV4cCI6MjA4NzMwODgxMX0.UX7WW9OyTUxwWA2Xyzy1i9RmjsTjU2NFaqrn6Nb1T0M';
const FB_LINK = 'https://www.facebook.com/lcstoregachaverse';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtPrice = (n) => Number(n || 0).toLocaleString('vi-VN') + ' ₫';
const NEW_DAYS = 7;

let allAccounts = [];
let loaded = false;

function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'error' ? ' toast--error' : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 320); }, 2400);
}

function renderSkeleton() {
    $('userGrid').innerHTML = Array.from({ length: 8 }, () => `
        <div class="skel">
            <div class="skel__img"></div>
            <div class="skel__line"></div>
            <div class="skel__line skel__line--short"></div>
        </div>`).join('');
}

async function loadShop() {
    if (!loaded) renderSkeleton();
    const { data, error } = await sb.from('accounts').select('*').order('created_at', { ascending: false });
    if (error) {
        $('userGrid').innerHTML = '<p class="empty">Không tải được dữ liệu, thử tải lại trang nhé.</p>';
        console.error(error);
        return;
    }
    allAccounts = data || [];
    loaded = true;
    applyFilters();
}

function applyFilters() {
    const q = $('searchCode').value.trim().toLowerCase();
    const maxPrice = parseFloat($('maxPrice').value) || Infinity;
    const status = $('statusFilter').value;
    const sort = $('sortBy').value;

    let list = allAccounts.filter(p =>
        String(p.code || '').toLowerCase().includes(q) &&
        Number(p.price) <= maxPrice &&
        (status === 'all' ? true : status === 'available' ? !p.is_sold : p.is_sold)
    );

    if (sort === 'price-asc')  list = [...list].sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    // 'newest' giữ nguyên thứ tự created_at desc từ query

    $('stockCount').textContent = allAccounts.filter(p => !p.is_sold).length;
    renderGrid(list);
}

function isNew(p) {
    return !p.is_sold && (Date.now() - new Date(p.created_at).getTime()) < NEW_DAYS * 864e5;
}

function renderGrid(list) {
    const grid = $('userGrid');
    if (!list.length) {
        grid.innerHTML = '<p class="empty">Không tìm thấy acc phù hợp bộ lọc.</p>';
        return;
    }
    grid.innerHTML = list.map(p => `
        <article class="card ${p.is_sold ? 'is-sold' : ''}" data-id="${Number(p.id)}">
            ${p.is_sold ? '<div class="sold-stamp">SOLD OUT</div>' : isNew(p) ? '<span class="badge-new">Mới về</span>' : ''}
            <button class="card__img" type="button" data-act="zoom" ${p.is_sold ? 'disabled' : ''} aria-label="Xem ảnh acc ${esc(p.code)}">
                <img src="${esc(p.image_url)}" loading="lazy" alt="Acc ${esc(p.code)}">
            </button>
            <div class="card__body">
                <span class="card__code">[${esc(p.code)}]</span>
                <span class="card__price">${fmtPrice(p.price)}</span>
                <div class="card__actions">
                    ${p.is_sold ? '' : `<button class="btn btn--copy" type="button" data-act="copy">Sao chép thông tin</button>`}
                    ${p.is_sold
                        ? '<span class="btn" style="background:var(--color-paper-3); color:var(--color-neutral); cursor:default">Hết hàng</span>'
                        : `<a class="btn btn--buy" href="${FB_LINK}" target="_blank" rel="noopener">Liên hệ mua</a>`}
                </div>
            </div>
        </article>`).join('');
}

/* Event delegation */
$('userGrid').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('.card');
    const p = allAccounts.find(x => Number(x.id) === Number(card.dataset.id));
    if (!p) return;

    if (btn.dataset.act === 'zoom' && !p.is_sold) {
        $('zoomImg').src = p.image_url;
        $('lightbox').classList.add('is-open');
    }
    if (btn.dataset.act === 'copy') {
        const text = `Mình muốn mua acc Limbus\nMã tài khoản: ${p.code}\nGiá: ${fmtPrice(p.price)}`;
        try {
            await navigator.clipboard.writeText(text);
            btn.classList.add('is-done');
            btn.textContent = 'Đã sao chép ✓';
            toast('Đã copy thông tin mã ' + p.code + ' — dán vào tin nhắn Fanpage nhé!');
            setTimeout(() => { btn.classList.remove('is-done'); btn.textContent = 'Sao chép thông tin'; }, 2000);
        } catch {
            toast('Trình duyệt chặn copy, hãy chụp màn hình gửi shop nhé.', 'error');
        }
    }
});

$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('is-open'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').classList.remove('is-open'); });

['searchCode', 'maxPrice'].forEach(id => $(id).addEventListener('input', applyFilters));
['statusFilter', 'sortBy'].forEach(id => $(id).addEventListener('change', applyFilters));

/* Real-time: admin đăng/bán acc là trang khách tự cập nhật */
sb.channel('public-shop-updates')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, loadShop)
  .subscribe();

loadShop();
</script>
</body>
</html>
